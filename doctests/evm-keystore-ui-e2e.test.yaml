name: "Opening and unlocking a wallet for an app, in the keys app"
output: evm-keystore-ui-e2e.md
release: ""

intro: |
  Apps never get a wallet's keys. An app that wants a Bitcoin wallet asks the signer manager to
  **open** one for it, and the person decides in the keys app, `evm_keystore_ui`: which wallet,
  and whether to hand it over. The app then collects the wallet's descriptors and its database
  key with the receipt it was given, and nothing else. An app can also ask for an account to stay
  **unlocked** for a while; the person decides the terms — how long, how many signatures, for
  which apps, and whether each one is still confirmed — whatever the app asked for.

  This doc-test runs it headlessly. `keys_probe`, a fixture app, asks to open any native segwit
  wallet on regtest before one exists, so the person adds one from the request, keeping its
  recovery phrase, and opens it. The app then asks to unlock it for two confirmed signatures.
  Then the person looks at the wallet's descriptor, makes an EVM wallet from the kept phrase
  without typing it, looks at the phrase and forgets it. Last, the Signer sends the person here
  to unlock the EVM wallet's account, which the person does on their own terms.
  Beside its own accounts, the keys app lists the ones a mock device offers through the manager,
  and shows it when the device goes away.
  The keys app is driven the way a person would drive it, through
  [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp).

what_you_build: "The keystore, the signer manager, the keys app and a requesting app, run together in a headless host, with an open and an unlock decided through the real QML surface."

what_you_learn:
  - "What an app asking to open a wallet sees, and what it can do with it"
  - "How the person picks the wallet, and what the keys app says that hands over"
  - "How an app asks for unlock terms, and how the person grants their own"
  - "How to lock everything again"
  - "How a Bitcoin wallet is added from an app's request, and what keeping its phrase risks"
  - "Where the descriptor and the kept phrase are shown, and behind which warnings"

prerequisites:
  - |
    **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).
  - "**A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."

sections:
  - title: "Build the pieces"
    step: true
    steps:
      - title: "The host and the test driver"
        run: |
          set -euo pipefail
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
      - title: "The host really landed"
        check_file: "result-app"
      - title: "Build the keystore"
        run: "nix build 'github:logos-co/logos-evm-keystore-module/15c44cc01550ba1b1a92e0a55ef29f17207b818d#install' --no-write-lock-file -o result-keystore"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-module#install' --no-write-lock-file -o result-keystore"
      - title: "Build the signer manager"
        run: "nix build 'github:logos-co/logos-signer-manager-module/695783a8629d0fd19d3e2d5ceb96e4722d668458#install' --no-write-lock-file -o result-manager"
        code_block: "nix build 'github:logos-co/logos-signer-manager-module#install' --no-write-lock-file -o result-manager"
      - title: "Build the keys app"
        run: "nix build 'github:logos-co/logos-evm-keystore-ui{release}#install' --no-write-lock-file -o result-keys"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-ui#install' --no-write-lock-file -o result-keys"
      - title: "Build the requesting app"
        run: "nix build 'github:logos-co/logos-evm-keystore-ui{release}?dir=doctests/keys-probe#install' --no-write-lock-file -o result-probe"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-ui?dir=doctests/keys-probe#install' --no-write-lock-file -o result-probe"
      - title: "Build the mock device"
        run: "nix build 'github:logos-co/logos-signer-manager-module/1a385f4e41ef54f388a192037bd9d9aa7165a505?dir=doctests/mock-device#install' --no-write-lock-file -o result-device"
        code_block: "nix build 'github:logos-co/logos-signer-manager-module?dir=doctests/mock-device#install' --no-write-lock-file -o result-device"
      - title: "Build capability_module"
        run: "nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability"
      - title: "Lay them out for the host"
        run: |
          set -euo pipefail
          mkdir -p tree/modules tree/plugins
          cp -r result-keystore/modules/*   tree/modules/
          cp -r result-manager/modules/*    tree/modules/
          cp -r result-probe/modules/*      tree/modules/
          cp -r result-device/modules/*     tree/modules/
          cp -r result-capability/modules/* tree/modules/
          cp -r result-keys/plugins/*       tree/plugins/
          chmod -R u+w tree
          ls tree/modules tree/plugins
        expect_contains:
          - "keystore_module"
          - "signer_manager_module"
          - "keys_probe"
          - "mock_device_signer"
          - "evm_keystore_ui"

  - title: "An app asks to open a wallet, then to unlock it"
    step: true
    text: |
      `keys_probe` names the roles for this run — the keys app administers the keystore and
      decides the manager's open and unlock requests — and asks to open a wallet at once.
    steps:
      - title: "Open and unlock, decided in the keys app"
        ui_test:
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/evm_keystore_ui -m ./tree/modules --load keys_probe -u ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "The request arrives"
              action: wait_for
              texts: ["keys_probe asks to open a wallet"]
              timeout: 35000

            - name: "A device's accounts show beside the rest"
              # A mock device signer offers them through the manager; the keys app only lists them.
              action: wait_for
              texts:
                - "Mock EVM — mock_device_signer, connected"
                - "Mock native segwit — mock_device_signer, connected"
                - "Mock taproot — mock_device_signer, connected"
              timeout: 10000

            - name: "Open it"
              action: click
              target: "keys_probe asks to open a wallet"

            - name: "The manager's own lines, and what opening hands over"
              action: wait_for
              texts:
                - "keys_probe asks to open a Bitcoin wallet"
                - "Any native segwit wallet on regtest: pick one, create one or restore one"
                - "keys_probe will see every address and transaction of this wallet, and can ask you to sign. It can't sign by itself."
              timeout: 6000

            # The lines exist before the sheet opens, and opening clears it: act only once it is open.
            - name: "The sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "No wallet matches yet"
              action: wait_for
              texts: ["No wallet here matches. Add one, and it is picked here."]
              timeout: 5000

            - name: "Add one from the request"
              action: click_object
              find_value: "accessAddWallet"

            # Clicks are posted, and opening a sheet clears it: act in one only once it is open.
            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinImportSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "The request fixes the kind and the network"
              action: wait_for
              texts: ["The app's request decides the kind of wallet and its network."]
              timeout: 5000

            - name: "From a typed phrase"
              action: click_object
              find_value: "btcSourceType"

            - name: "The phrase"
              action: set_text
              find_by: "objectName"
              find_value: "btcPhraseField"
              value: "test test test test test test test test test test test junk"

            - name: "The wallet's password"
              action: set_text
              find_by: "objectName"
              find_value: "btcWalletPasswordField"
              value: "doctest-pw"

            - name: "Its name"
              action: set_text
              find_by: "objectName"
              find_value: "btcWalletNameField"
              value: "Regtest wallet"

            - name: "Keep the recovery phrase"
              action: click_object
              find_value: "btcKeepPhrase"

            - name: "What keeping it risks is said first"
              action: wait_for
              texts: ["You can see the phrase again and add wallets without typing it. Someone with a copy of this keystore and this password gets every account of every coin this phrase makes, including ones never created here. Keep it only if you would keep the paper copy on this computer too."]
              timeout: 5000

            - name: "A password of its own"
              action: set_text
              find_by: "objectName"
              find_value: "btcKeepPasswordField"
              value: "phrase-pw"

            - name: "Add it"
              action: click_object
              find_value: "btcConfirm"

            - name: "Back in the request, the new wallet is picked"
              action: expect_property
              find_by: "objectName"
              find_value: "accessWallet_0"
              property: "checked"
              value: true
              timeout: 15000

            - name: "The wallet sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinImportSheet"
              property: "visible"
              value: false
              timeout: 5000
              screenshot: "evm-keystore-ui-added-in-request.png"

            - name: "The wallet is listed, with its phrase kept"
              action: wait_for
              texts: ["PHRASE KEPT"]
              timeout: 15000


            - name: "Type the wallet's password"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "doctest-pw"

            - name: "Open it for the app"
              action: click_object
              find_value: "accessApproveButton"

            - name: "It is listed as open for the app"
              action: wait_for
              texts: ["Regtest wallet — open for keys_probe"]
              timeout: 10000
              screenshot: "evm-keystore-ui-opened.png"

            - name: "The sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "visible"
              value: false
              timeout: 5000

            - name: "The unlock request arrives"
              action: wait_for
              texts: ["keys_probe asks to unlock an account"]
              timeout: 20000

            - name: "Show it"
              action: click
              target: "keys_probe asks to unlock an account"

            - name: "The terms are offered as the app asked: two signatures"
              action: wait_for
              texts: ["As asked: 2"]
              timeout: 6000

            - name: "The sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Type the account's password"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "doctest-pw"

            - name: "Unlock it"
              action: click_object
              find_value: "accessApproveButton"

            - name: "It is listed as unlocked, on the person's terms"
              action: wait_for
              texts: ["Regtest wallet (Bitcoin) — until locked, 2 left, for keys_probe, confirmed"]
              timeout: 10000
              screenshot: "evm-keystore-ui-unlocked.png"

            - name: "Unplugged, the device's accounts stay listed, not connected"
              # The probe unplugs the mock device a second after its unlock, and nothing else asks the manager meanwhile.
              action: wait_for
              texts:
                - "Mock EVM — mock_device_signer, not connected"
                - "Mock native segwit — mock_device_signer, not connected"
                - "Mock taproot — mock_device_signer, not connected"
              timeout: 10000

            - name: "Lock everything"
              action: click_object
              find_value: "lockAllButton"

            - name: "Nothing is unlocked any more"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockedAccounts"
              property: "visible"
              value: false
              timeout: 10000

            # The unlocked list just closed, moving everything below it: let the layout settle
            # before a click aimed by position.
            - name: "The list settles"
              action: sleep
              ms: 500

            - name: "Manage the Bitcoin wallet"
              action: click
              target: "Manage…"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinWalletSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Its descriptor, behind its warning"
              action: click_object
              find_value: "btcShowDescriptor"

            - name: "The receive descriptor"
              action: wait_for
              texts:
                - "Anyone with the descriptor sees this wallet's whole history and every future payment. It can't spend."
                - "wpkh([16a93ed0/84'/1'/0']tpubDCTawRj1voCsGHoKQopGdxi1UXEfy8eeogsbA7SxDL1j7tvTfwdF6jQNSneAQw5a2x29XY6PWbnKMx68oM7BYoew8eRySvVaLZxkrBzWr4A/0/*)#a222upy4"
              timeout: 6000
              screenshot: "evm-keystore-ui-descriptor.png"

            - name: "Close it"
              action: click_object
              find_value: "btcWalletClose"

            - name: "It has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinWalletSheet"
              property: "visible"
              value: false
              timeout: 5000

            - name: "An EVM wallet from the kept phrase, without typing it"
              action: click_object
              find_value: "importPhraseButton"

            - name: "The import sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "importPhraseSheet"
              property: "opened"
              value: true
              timeout: 5000

            # Chosen by property: a click this soon after the sheet opens can land before its layout does.
            - name: "Use the kept phrase"
              action: set_property
              find_by: "objectName"
              find_value: "importSourceKept"
              property: "checked"
              value: true

            - name: "The kept phrases are listed"
              action: expect_property
              find_by: "objectName"
              find_value: "importKept_0"
              property: "visible"
              value: true
              timeout: 5000

            - name: "Pick it"
              action: click_object
              find_value: "importKept_0"

            - name: "Its own password"
              action: set_text
              find_by: "objectName"
              find_value: "importKeptPasswordField"
              value: "phrase-pw"

            - name: "The account's password"
              action: set_text
              find_by: "objectName"
              find_value: "seedPasswordField"
              value: "doctest-pw"

            - name: "Its name"
              action: set_text
              find_by: "objectName"
              find_value: "importWalletNameField"
              value: "EVM wallet"

            - name: "Import it"
              action: click_object
              find_value: "importPhraseConfirm"

            - name: "The import sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "importPhraseSheet"
              property: "visible"
              value: false
              timeout: 15000

            - name: "The EVM wallet is listed"
              action: wait_for
              texts: ["EVM wallet"]
              timeout: 10000

            - name: "The kept phrase"
              action: click_object
              find_value: "keptPhraseButton_0"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "keptPhraseSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Its own password"
              action: set_text
              find_by: "objectName"
              find_value: "phrasePasswordField"
              value: "phrase-pw"

            - name: "Show it"
              action: click_object
              find_value: "phraseShowButton"

            - name: "The words, behind their warning"
              action: wait_for
              texts:
                - "Anyone who sees it owns every account it makes. Check that no camera or person can see your screen."
                - "test test test test test test test test test test test junk"
              timeout: 6000

            - name: "Forget it"
              action: click_object
              find_value: "phraseForgetButton"

            - name: "No phrase is kept any more"
              action: expect_property
              find_by: "objectName"
              find_value: "keptPhrases"
              property: "visible"
              value: false
              timeout: 10000

            - name: "The Signer sends the person here to unlock the EVM wallet's account"
              # What the shell delivers on `keystore.accounts.unlock`. This host has no shell, so
              # the view's own handler is called; the address is matched without regard to case.
              action: call_method
              find_value: "keystoreRoot"
              method: "serviceIntent"
              args: ["req-unlock", "keystore.accounts.unlock", {"account": "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266", "app": "keys_probe"}, "evm_signer_ui"]

            - name: "The unlock sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "That account is offered first"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockAccount_0"
              property: "checked"
              value: true

            - name: "...for the app that asked"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockAppsField"
              property: "text"
              value: "keys_probe"

            - name: "The request waits for the person"
              action: expect_property
              find_by: "objectName"
              find_value: "keystoreRoot"
              property: "unlockIntent"
              value: "req-unlock"

            - name: "Until locked, so the line below reads the same at any speed"
              action: click_object
              find_value: "unlockTtlUntilLocked"

            - name: "The account's password"
              action: set_text
              find_by: "objectName"
              find_value: "unlockPasswordField"
              value: "doctest-pw"

            - name: "Unlock it"
              action: click_object
              find_value: "unlockConfirmButton"

            - name: "The Signer's request is answered"
              action: expect_property
              find_by: "objectName"
              find_value: "keystoreRoot"
              property: "unlockIntent"
              value: ""
              timeout: 10000

            - name: "Listed as unlocked, for the app the Signer named"
              action: wait_for
              texts: ["0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 — until locked, 1 left, for keys_probe, confirmed"]
              timeout: 10000
              screenshot: "evm-keystore-ui-unlocked-for-signer.png"

      - title: "What the app was handed"
        text: |
          The descriptors and a 32-byte database key for the wallet it was given — public
          material and a key of its own, never the wallet's — and the terms the person granted.
        run: "grep -h 'KEYS_PROBE_' ui-test-app.log"
        expect_contains:
          - "KEYS_PROBE_OPENED: wpkh([16a93ed0/84'/1'/0']tpub"
          - "databaseKey=64 hex chars"
          - '"count":2'
          - '"apps":["keys_probe"]'
          - "KEYS_PROBE_UNPLUGGED"
