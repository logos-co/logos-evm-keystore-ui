name: "Opening and unlocking a wallet for an app, in the keys app"
output: evm-keystore-ui-e2e.md
release: ""

intro: |
  Apps never get a wallet's keys. An app that wants a Bitcoin wallet asks the signer manager to
  **open** one for it, and sends the person to the keys app, `evm_keystore_ui`, through Basecamp's
  `keystore.accounts.open` intent. The person decides there: which wallet, and whether to hand
  it over. The app then collects the wallet's descriptors and its database key with the receipt
  it was given, and nothing else. An app can also ask for an account to stay **unlocked** for a
  while; the person decides the terms — how long, how many signatures, for which apps, and
  whether each one is still confirmed — whatever the app asked for.

  This doc-test runs it headlessly, in Basecamp's standalone mode. `keys_probe`, a fixture
  module, asks to open any native segwit wallet on regtest before one exists, and its app,
  `keys_probe_ui`, sends the person to the keys app with each request. The person adds a wallet
  from the request, keeping its recovery phrase and saying when it was first used, and opens it.
  The app then asks to unlock it for two confirmed signatures, and to open a wallet whose key is
  on a mock device. Then the person looks at the wallet's descriptor, adds an EVM account from the
  kept phrase without typing it, looks at the phrase and forgets it. The Signer sends the person
  here to unlock the EVM account, which the person does on their own terms. Last, the app asks
  for another wallet, and the person makes a new one for it, whose history starts that day.
  The keys app is driven the way a person would drive it, through
  [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp).

what_you_build: "The keystore, the signer manager, the keys app and a requesting app, run together in Basecamp's standalone mode, with an open and an unlock decided through the real QML surface."

what_you_learn:
  - "What an app asking to open a wallet sees, and what it can do with it"
  - "How the person picks the wallet, and what the keys app says that hands over"
  - "How an app asks for unlock terms, and how the person grants their own"
  - "How a Bitcoin wallet is added from an app's request, and what keeping its phrase risks"
  - "Where an app starts looking for a wallet's coins: the day it was first used, or made"
  - "Where the descriptor and the kept phrase are shown, and behind which warnings"

prerequisites:
  - |
    **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).
  - "**A Linux or macOS machine.** Basecamp runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."

sections:
  - title: "Build the pieces"
    step: true
    steps:
      - title: "The host and the test driver"
        run: |
          set -euo pipefail
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
      - title: "The host really landed"
        check_file: "result-basecamp/bin/LogosBasecamp"
      - title: "Build the keystore"
        run: "nix build 'github:logos-co/logos-evm-keystore-module/a984c257eda3a3107f5b85cd9d1bf3ecf6f66b65#install' --no-write-lock-file -o result-keystore"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-module#install' --no-write-lock-file -o result-keystore"
      - title: "Build the signer manager"
        run: "nix build 'github:logos-co/logos-signer-manager-module/cd661b5a5fc119c01154982bc3c84f023dbcc4a2#install' --no-write-lock-file -o result-manager"
        code_block: "nix build 'github:logos-co/logos-signer-manager-module#install' --no-write-lock-file -o result-manager"
      - title: "Build the keys app"
        run: "nix build 'github:logos-co/logos-evm-keystore-ui{release}#install' --no-write-lock-file -o result-keys"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-ui#install' --no-write-lock-file -o result-keys"
      - title: "Build the requesting module"
        run: "nix build 'github:logos-co/logos-evm-keystore-ui{release}?dir=doctests/keys-probe#install' --no-write-lock-file -o result-probe"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-ui?dir=doctests/keys-probe#install' --no-write-lock-file -o result-probe"
      - title: "Build the requesting app"
        text: "Basecamp loads a module only for an app that depends on it, so `keys_probe` comes with an app of its own."
        run: "nix build 'github:logos-co/logos-evm-keystore-ui{release}?dir=doctests/keys-probe-ui#install' --no-write-lock-file -o result-probeui"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-ui?dir=doctests/keys-probe-ui#install' --no-write-lock-file -o result-probeui"
      - title: "Build the mock device"
        run: "nix build 'github:logos-co/logos-signer-manager-module/1a385f4e41ef54f388a192037bd9d9aa7165a505?dir=doctests/mock-device#install' --no-write-lock-file -o result-device"
        code_block: "nix build 'github:logos-co/logos-signer-manager-module?dir=doctests/mock-device#install' --no-write-lock-file -o result-device"
      - title: "Lay out the modules the two apps depend on"
        run: |
          set -euo pipefail
          mkdir -p tree/modules
          cp -r result-keystore/modules/* tree/modules/
          cp -r result-manager/modules/*  tree/modules/
          cp -r result-probe/modules/*    tree/modules/
          cp -r result-device/modules/*   tree/modules/
          chmod -R u+w tree
          ls tree/modules
        expect_contains:
          - "keystore_module"
          - "signer_manager_module"
          - "keys_probe"
          - "mock_device_signer"

  - title: "An app asks to open a wallet, then to unlock it"
    step: true
    text: |
      `keys_probe` names the roles for this run — the keys app administers the keystore and
      decides the manager's open and unlock requests — and asks to open a wallet at once.
      `keys_probe_ui` sends the person to the keys app with the request's handle, and Basecamp
      asks first which app should answer it.
    steps:
      - title: "Open and unlock, decided in the keys app"
        ui_test:
          launch: "env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 LOGOS_NO_SCHEME_REGISTER=1 ./result-basecamp/bin/LogosBasecamp --module ./result-keys --module ./result-probeui --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            # Opening keys_probe_ui loads keys_probe, which asks; the app raises keystore.accounts.open.
            - name: "Basecamp asks which app should answer the request"
              action: expect_property
              find_by: "objectName"
              find_value: "intentProvider_evm_keystore_ui"
              property: "visible"
              value: true
              timeout: 60000

            - name: "The keys app"
              action: click_object
              find_value: "intentChooserConfirm"

            - name: "The request opens in the keys app"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 30000

            - name: "The manager's own lines, and what opening hands over"
              action: wait_for
              texts:
                - "keys_probe asks to open a Bitcoin wallet"
                - "Any native segwit wallet on regtest: pick one, create one or restore one"
                - "keys_probe will see every address and transaction of this wallet, and can ask you to sign. It can't sign by itself."
              timeout: 6000

            # A mock device signer offers it through the manager, beside the keystore's wallets: one
            # row per wallet, naming every signer that holds it.
            - name: "Only the device's wallet matches yet"
              action: wait_for
              texts: ["Pick the wallet to open, or add one:", "Mock native segwit · Native SegWit · account 0 — software keys"]
              timeout: 5000

            - name: "Add one from the request"
              action: click_object
              find_value: "accessAddWallet"

            # Clicks are posted, and opening a sheet clears it: act in one only once it is open.
            - name: "The shared account wizard opens"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "From a typed phrase"
              action: click_object
              find_value: "flowImportPhrase"

            - name: "The phrase"
              action: set_text
              find_by: "objectName"
              find_value: "flowWords"
              value: "test test test test test test test test test test test junk"

            - name: "Preview accounts"
              action: click_object
              find_value: "flowContinue"

            - name: "The preview is listed"
              action: expect_property
              find_by: "objectName"
              find_value: "flowSelect_0"
              property: "visible"
              value: true
              timeout: 15000

            - name: "Select the first account"
              action: click_object
              find_value: "flowSelect_0"

            - name: "Review files"
              action: click_object
              find_value: "flowReview"

            - name: "A restored wallet may say when it was first used"
              action: set_text
              find_by: "objectName"
              find_value: "flowBirthday"
              value: "2021-11-14"

            - name: "The file password"
              action: set_text
              find_by: "objectName"
              find_value: "flowPassword"
              value: "doctest-pw"

            - name: "Confirm the password"
              action: set_text
              find_by: "objectName"
              find_value: "flowRepeatPassword"
              value: "doctest-pw"

            - name: "Its name"
              action: set_text
              find_by: "objectName"
              find_value: "flowName"
              value: "Regtest wallet"

            - name: "Keep an encrypted recovery source"
              action: click_object
              find_value: "flowKeepRecovery"

            - name: "Save the account file"
              action: click_object
              find_value: "flowSave"

            - name: "The wizard closes and leaves access for review"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "visible"
              value: false
              timeout: 15000

            - name: "The new wallet is picked"
              action: expect_property
              find_by: "objectName"
              find_value: "accessWallet_0"
              property: "checked"
              value: true
              timeout: 15000
              screenshot: "evm-keystore-ui-added-in-request.png"

            - name: "Type the wallet's password"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "doctest-pw"

            - name: "Open it for the app"
              action: click_object
              find_value: "accessApproveButton"

            - name: "The sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "visible"
              value: false
              timeout: 10000

            - name: "The app asks to unlock it, and Basecamp asks which app should answer"
              action: expect_property
              find_by: "objectName"
              find_value: "intentProvider_evm_keystore_ui"
              property: "visible"
              value: true
              timeout: 20000

            - name: "The keys app"
              action: click_object
              find_value: "intentChooserConfirm"

            - name: "The sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 10000

            - name: "The terms are offered as the app asked: two signatures"
              action: wait_for
              texts: ["As asked: 2"]
              timeout: 6000
              screenshot: "evm-keystore-ui-unlock-asked.png"

            - name: "Type the account's password"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "doctest-pw"

            - name: "Unlock it"
              action: click_object
              find_value: "accessApproveButton"

            - name: "The sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "visible"
              value: false
              timeout: 10000

            - name: "The app asks to open the device's wallet"
              action: expect_property
              find_by: "objectName"
              find_value: "intentProvider_evm_keystore_ui"
              property: "visible"
              value: true
              timeout: 20000

            - name: "The keys app"
              action: click_object
              find_value: "intentChooserConfirm"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 10000

            - name: "A device signs on its own screen: nothing to unlock"
              action: expect_property
              find_by: "objectName"
              find_value: "accessAlsoUnlock"
              property: "visible"
              value: false
              timeout: 5000

            - name: "Its first open sets the password of its data"
              action: expect_property
              find_by: "objectName"
              find_value: "accessPasswordAgainField"
              property: "visible"
              value: true
              timeout: 5000

            - name: "A password for its data"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "data-pw"

            - name: "Typed again"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordAgainField"
              value: "data-pw"

            - name: "The day it was first used"
              action: set_text
              find_by: "objectName"
              find_value: "accessBirthdayField"
              value: "2021-11-14"
              screenshot: "evm-keystore-ui-device-open.png"

            - name: "Open it for the app"
              action: click_object
              find_value: "accessApproveButton"

            - name: "Its sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "visible"
              value: false
              timeout: 15000

            # Basecamp went back to the app that asked; the rest happens in the keys app.
            - name: "Back to the keys app"
              action: click_object
              find_value: "sidebar.app.evm_keystore_ui"

            - name: "It is in front"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.app.evm_keystore_ui"
              property: "checked"
              value: true
              timeout: 5000

            # The tab just changed: let the layout settle before a click aimed by position.
            - name: "The view settles"
              action: sleep
              ms: 500

            - name: "Manage the Bitcoin wallet"
              action: click
              target: "Manage…"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinWalletSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Its descriptor, behind its warning"
              action: click_object
              find_value: "btcShowDescriptor"

            - name: "The receive descriptor"
              action: wait_for
              texts:
                - "Anyone with the descriptor sees this wallet's whole history and every future payment. It can't spend."
                - "wpkh([16a93ed0/84'/1'/0']tpubDCTawRj1voCsGHoKQopGdxi1UXEfy8eeogsbA7SxDL1j7tvTfwdF6jQNSneAQw5a2x29XY6PWbnKMx68oM7BYoew8eRySvVaLZxkrBzWr4A/0/*)#a222upy4"
              timeout: 6000
              screenshot: "evm-keystore-ui-descriptor.png"

            - name: "Close it"
              action: click_object
              find_value: "btcWalletClose"

            - name: "It has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "bitcoinWalletSheet"
              property: "visible"
              value: false
              timeout: 5000

            - name: "An EVM account from the kept phrase, without typing it"
              action: click_object
              find_value: "addSeedWallet_0"

            - name: "The account wizard opens on that recovery source"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Only the kept phrase's own password is asked"
              action: expect_property
              find_by: "objectName"
              find_value: "flowPhrasePassword"
              property: "visible"
              value: true
              timeout: 5000

            - name: "...never its words"
              action: expect_property
              find_by: "objectName"
              find_value: "flowWords"
              property: "visible"
              value: false

            - name: "Its own password"
              action: set_text
              find_by: "objectName"
              find_value: "flowPhrasePassword"
              value: "doctest-pw"

            - name: "Preview accounts"
              action: click_object
              find_value: "flowContinue"

            - name: "Ethereum accounts are previewed"
              action: wait_for
              texts: ["0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"]
              timeout: 15000

            - name: "Select the first account"
              action: click_object
              find_value: "flowSelect_0"

            - name: "Review files"
              action: click_object
              find_value: "flowReview"

            - name: "The account's own name: the wallet has one already"
              action: set_text
              find_by: "objectName"
              find_value: "flowAccountName_0"
              value: "EVM wallet"

            - name: "The file password"
              action: set_text
              find_by: "objectName"
              find_value: "flowPassword"
              value: "doctest-pw"

            - name: "Confirm the password"
              action: set_text
              find_by: "objectName"
              find_value: "flowRepeatPassword"
              value: "doctest-pw"

            - name: "Save the account file"
              action: click_object
              find_value: "flowSave"

            - name: "The wizard has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "visible"
              value: false
              timeout: 15000

            - name: "The EVM account sits under the same recovery source, each account by its own name"
              action: wait_for
              texts: ["Regtest wallet", "Ethereum 1 · EVM wallet", "Bitcoin 1", "Account files from the same recovery source."]
              timeout: 10000
              screenshot: "evm-keystore-ui-same-source.png"

            - name: "The kept phrase"
              action: click_object
              find_value: "keptPhraseButton_0"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "keptPhraseSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "Its own password"
              action: set_text
              find_by: "objectName"
              find_value: "phrasePasswordField"
              value: "doctest-pw"

            - name: "Show it"
              action: click_object
              find_value: "phraseShowButton"

            - name: "The words, behind their warning"
              action: wait_for
              texts:
                - "Anyone who sees it owns every account it makes. Check that no camera or person can see your screen."
                - "test test test test test test test test test test test junk"
              timeout: 6000

            - name: "Forget it"
              action: click_object
              find_value: "phraseForgetButton"

            - name: "No phrase is kept any more"
              action: expect_property
              find_by: "objectName"
              find_value: "keptPhrases"
              property: "visible"
              value: false
              timeout: 10000

            - name: "The Signer sends the person here to unlock the EVM account"
              # What Basecamp delivers on `keystore.accounts.unlock`. The Signer is not installed
              # here, so the view's own handler is called; the address is matched without regard to case.
              action: call_method
              find_value: "keystoreRoot"
              method: "serviceIntent"
              args: ["req-unlock", "keystore.accounts.unlock", {"account": "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266", "app": "keys_probe"}, "evm_signer_ui"]

            - name: "The unlock sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "That account is offered first"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockAccount_0"
              property: "checked"
              value: true

            - name: "...for the app that asked"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockAppsField"
              property: "text"
              value: "keys_probe"

            - name: "The request waits for the person"
              action: expect_property
              find_by: "objectName"
              find_value: "keystoreRoot"
              property: "unlockIntent"
              value: "req-unlock"

            - name: "Until locked"
              action: click_object
              find_value: "unlockTtlUntilLocked"
              screenshot: "evm-keystore-ui-unlock-for-signer.png"

            - name: "The account's password"
              action: set_text
              find_by: "objectName"
              find_value: "unlockPasswordField"
              value: "doctest-pw"

            - name: "Unlock it"
              action: click_object
              find_value: "unlockConfirmButton"

            - name: "The Signer's request is answered"
              action: expect_property
              find_by: "objectName"
              find_value: "keystoreRoot"
              property: "unlockIntent"
              value: ""
              timeout: 10000

            - name: "The unlock sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "unlockSheet"
              property: "visible"
              value: false
              timeout: 5000

            - name: "Back to the app"
              action: click_object
              find_value: "sidebar.app.keys_probe_ui"

            - name: "It is in front"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.app.keys_probe_ui"
              property: "checked"
              value: true
              timeout: 5000

            - name: "The view settles"
              action: sleep
              ms: 500

            - name: "The app asks for a new wallet"
              action: click_object
              find_value: "askNewWallet"

            - name: "Basecamp asks which app should answer"
              action: expect_property
              find_by: "objectName"
              find_value: "intentProvider_evm_keystore_ui"
              property: "visible"
              value: true
              timeout: 20000

            - name: "The keys app"
              action: click_object
              find_value: "intentChooserConfirm"

            - name: "Its sheet is open"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "opened"
              value: true
              timeout: 10000

            - name: "Any taproot wallet on regtest"
              action: wait_for
              texts: ["Any taproot wallet on regtest: pick one, create one or restore one"]
              timeout: 5000

            - name: "Add one"
              action: click_object
              find_value: "accessAddWallet"

            - name: "The account wizard opens"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "opened"
              value: true
              timeout: 5000

            - name: "A new recovery phrase"
              action: click_object
              find_value: "flowCreatePhrase"

            - name: "It is made, and shown once"
              action: expect_property
              find_by: "objectName"
              find_value: "flowWord_0"
              property: "visible"
              value: true
              timeout: 10000

            - name: "Choose accounts"
              # The spec cannot read the words off the screen to confirm three of them, so it
              # calls what Choose accounts calls once they match.
              action: call_method
              find_value: "accountFlowSheet"
              method: "preview"

            - name: "The preview is listed"
              action: expect_property
              find_by: "objectName"
              find_value: "flowSelect_0"
              property: "visible"
              value: true
              timeout: 15000

            - name: "Select the first account"
              action: click_object
              find_value: "flowSelect_0"

            - name: "Review files"
              action: click_object
              find_value: "flowReview"

            - name: "A wallet made here starts today: no day is asked"
              action: expect_property
              find_by: "objectName"
              find_value: "flowBirthday"
              property: "visible"
              value: false
              timeout: 5000

            - name: "Its name"
              action: set_text
              find_by: "objectName"
              find_value: "flowName"
              value: "New wallet"

            - name: "The file password"
              action: set_text
              find_by: "objectName"
              find_value: "flowPassword"
              value: "doctest-pw"

            - name: "Confirm the password"
              action: set_text
              find_by: "objectName"
              find_value: "flowRepeatPassword"
              value: "doctest-pw"

            - name: "Save the account file"
              action: click_object
              find_value: "flowSave"

            - name: "The wizard has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accountFlowSheet"
              property: "visible"
              value: false
              timeout: 15000

            - name: "Type the wallet's password"
              action: set_text
              find_by: "objectName"
              find_value: "accessPasswordField"
              value: "doctest-pw"

            - name: "The new wallet is picked, so it can be opened"
              action: expect_property
              find_by: "objectName"
              find_value: "accessApproveButton"
              property: "enabled"
              value: true
              timeout: 10000

            - name: "Open it for the app"
              action: click_object
              find_value: "accessApproveButton"

            - name: "Its sheet has closed"
              action: expect_property
              find_by: "objectName"
              find_value: "accessSheet"
              property: "visible"
              value: false
              timeout: 15000

      - title: "What the app was handed"
        text: |
          The descriptors and a 32-byte database key for each wallet it was given — public
          material and a key of its own, never the wallet's — where each wallet's history starts,
          and the terms the person granted.
        run: "grep -h 'KEYS_PROBE_' ui-test-app.log"
        expect_contains:
          - "KEYS_PROBE_OPENED: wpkh([16a93ed0/84'/1'/0']tpub"
          - "databaseKey=64 hex chars"
          - "KEYS_PROBE_STARTS: origin=restored birthday=2021-11-14"
          - "KEYS_PROBE_DEVICE_OPENED: origin=restored birthday=2021-11-14 databaseKey=64 hex chars"
          - '"count":2'
          - '"apps":["keys_probe"]'

      - title: "A wallet made in the keys app starts the day it was made"
        run: |
          set -euo pipefail
          grep -h "KEYS_PROBE_NEW_STARTS: origin=created birthday=$(date -u +%Y-%m-%d)" ui-test-app.log
        expect_contains:
          - "KEYS_PROBE_NEW_STARTS: origin=created birthday=20"
